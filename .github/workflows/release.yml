# Builds signed release bundles for every platform and publishes them as a
# GitHub Release. The Tauri CLI generates `latest.json` (the manifest the
# in-app updater polls) and signs every bundle with TAURI_SIGNING_PRIVATE_KEY.
#
# Releasing: write the version's notes in CHANGELOG.md, bump the version in
# package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json, then push a tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          contents of the updater signing key file
#                                      (the existing key is %USERPROFILE%\.tauri\minearcade.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD key password (empty if none)
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows
          - platform: ubuntu-latest
            name: Linux
          - platform: macos-latest
            name: macOS

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds one app for Apple Silicon and Intel Macs together (universal).
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install the Tauri CLI
        run: npm ci

      # The release page shows this version's section of CHANGELOG.md ("## v0.6.5" up to the
      # next "## "). A tag without one stops here, so no release goes out without notes.
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          notes=$(awk -v tag="## ${GITHUB_REF_NAME}" '{ sub(/\r$/, "") } $0 == tag { on = 1; next } on && /^## / { exit } on' CHANGELOG.md | sed -e '/./,$!d')
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no notes under '## ${GITHUB_REF_NAME}'. Add them and tag again."
            exit 1
          fi
          { echo 'body<<ORBIT_NOTES_END'; printf '%s\n' "$notes"; echo 'ORBIT_NOTES_END'; } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        id: build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.platform == 'ubuntu-latest' && '--bundles deb,rpm,appimage' || matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
          # Point the Windows updater entry at the NSIS installer (per-user, no
          # elevation), which is what the passive install mode expects.
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: false
          tagName: ${{ github.ref_name }}
          releaseName: Orbit Launcher ${{ github.ref_name }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            **Install**
            - **Windows:** `Orbit Launcher_*_x64-setup.exe` (or the `.msi`).
            - **Linux:** `Orbit Launcher_*_amd64.AppImage` (`chmod +x` and run), or the `.deb` / `.rpm`.
            - **macOS (Apple Silicon and Intel):** open `Orbit Launcher_*_universal.dmg` and drag Orbit Launcher
              into Applications. The first time you open it, macOS says it can't check the app: open
              System Settings > Privacy & Security, scroll down and click **Open Anyway** (only needed once).

            Already installed? Orbit Launcher updates itself: accept the prompt or use Settings > Updates.
          releaseDraft: false
          prerelease: false

      # A macOS app whose signature doesn't cover the whole bundle is shown as "damaged" and can't be
      # opened at all. Fail the run (and so stop the release from looking finished) if that happens.
      - name: Check the macOS app's signature
        if: matrix.platform == 'macos-latest'
        run: |
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/"* | grep -q 'x86_64' && lipo -archs "$app/Contents/MacOS/"* | grep -q 'arm64'
