# Builds the launcher's Rust code and runs its tests on every pushed branch, without publishing
# anything (Release only runs for version tags).
name: Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib
