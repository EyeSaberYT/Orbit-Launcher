# Builds unsigned installers for every platform and attaches them to the workflow
# run as downloadable artifacts. Nothing is published and no secrets are needed,
# so this is safe for test builds. (Signed releases with in-app updates go through
# release.yml, triggered by a version tag.)
#
# Run it from the Actions tab ("Build installers" > Run workflow), or:
#   gh workflow run build-installers.yml
name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows
            bundles: nsis
            output: src-tauri/target/release/bundle/nsis/*.exe
          - platform: ubuntu-22.04
            name: Linux
            bundles: deb
            output: src-tauri/target/release/bundle/deb/*.deb
          - platform: macos-latest
            name: macOS
            bundles: dmg
            # Universal: runs natively on Apple Silicon and Intel Macs.
            target: universal-apple-darwin
            output: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Build
        shell: bash
        run: >
          npx tauri build --bundles ${{ matrix.bundles }}
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-launcher-${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error
